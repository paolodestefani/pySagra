[project]
name = "pySagra"
version = "1.0.0"
description = "A simple program to manage a food stand"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
# keep minimum versions aligned with the MRV_* constants in App/__init__.py
dependencies = [
    "PySide6-Essentials>=6.11",
    "psycopg[binary]>=3.3.6",
    "cryptography",
    "python-escpos[usb]>=3.1",
    "python-barcode",
    "qrcode",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "mypy",
]
